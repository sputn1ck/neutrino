<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neutrino WASM Demo</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17202a;
      --muted: #5a6673;
      --line: #ccd5df;
      --panel: #f6f8fa;
      --accent: #116d6e;
      --accent-2: #8b4a18;
      --danger: #9f2d2d;
      --paper: #ffffff;
      --ok: #1f7a4d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
    }
    main {
      width: min(1120px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 28px 0;
    }
    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }
    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.1;
      letter-spacing: 0;
    }
    .statusbar {
      display: grid;
      gap: 8px;
      min-width: 220px;
    }
    .status,
    .metric {
      border: 1px solid var(--line);
      padding: 8px 10px;
      font-size: 14px;
      background: var(--panel);
    }
    .status {
      text-align: center;
    }
    .metric {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }
    .metric strong {
      color: var(--ok);
    }
    .grid {
      display: grid;
      grid-template-columns: minmax(280px, 360px) 1fr;
      gap: 18px;
      margin-top: 18px;
    }
    section {
      min-width: 0;
    }
    .controls {
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 14px;
    }
    label {
      display: block;
      margin: 12px 0 6px;
      font-size: 13px;
      color: var(--muted);
    }
    input, select {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--line);
      padding: 8px 10px;
      font: inherit;
      background: #fff;
      color: var(--ink);
    }
    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 14px;
    }
    button {
      min-height: 38px;
      border: 1px solid transparent;
      padding: 8px 10px;
      font: inherit;
      font-weight: 650;
      color: #fff;
      background: var(--accent);
      cursor: pointer;
    }
    button.secondary { background: var(--accent-2); }
    button.stop { background: var(--danger); }
    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }
    .log {
      height: min(52vh, 520px);
      min-height: 320px;
      overflow: auto;
      background: #101820;
      color: #dbe7ef;
      padding: 14px;
      font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre-wrap;
      border: 1px solid #0c1218;
    }
    .peer-panel {
      margin-top: 12px;
      border: 1px solid var(--line);
      background: var(--panel);
      padding: 12px;
    }
    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
      font-size: 13px;
      color: var(--muted);
    }
    .peer-list {
      min-height: 86px;
      max-height: 180px;
      overflow: auto;
      white-space: pre-wrap;
      font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
      padding: 10px;
    }
    .hint {
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }
    @media (max-width: 760px) {
      header { align-items: start; flex-direction: column; }
      .grid { grid-template-columns: 1fr; }
      .log { height: 46vh; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Neutrino WASM Demo</h1>
        <div class="hint">SQLite runs in browser OPFS; Bitcoin P2P bytes tunnel through a WebSocket TCP proxy.</div>
      </div>
      <div class="statusbar">
        <div id="status" class="status">loading</div>
        <div class="metric"><span>Connected peers</span><strong id="peerCount">0</strong></div>
      </div>
    </header>

    <div class="grid">
      <section class="controls">
        <label for="proxy">WebSocket proxy</label>
        <input id="proxy" value="wss://konwss.tunn.dev/peer-proxy">

        <label for="peerSelect">Known compact-filter peer</label>
        <select id="peerSelect">
          <option value="116.202.84.94:8333">116.202.84.94:8333</option>
          <option value="95.98.206.92:8333">95.98.206.92:8333</option>
          <option value="87.209.244.90:8333">87.209.244.90:8333</option>
          <option value="141.224.209.201:8333">141.224.209.201:8333</option>
          <option value="89.182.141.61:8333">89.182.141.61:8333</option>
        </select>

        <label for="peer">Peer target</label>
        <input id="peer" value="116.202.84.94:8333">

        <div class="buttons">
          <button id="initBtn">Init DB</button>
          <button id="bestBtn" class="secondary">Best Block</button>
          <button id="connectBtn">Connect Peer</button>
          <button id="filterBtn" class="secondary">Fetch Tip Filter</button>
          <button id="peersBtn">List Peers</button>
          <button id="stopBtn" class="stop">Stop</button>
          <button id="clearBtn" class="secondary">Clear Log</button>
        </div>

        <div class="hint">The proxy must accept binary WebSocket frames and forward raw TCP bytes to the target host:port.</div>
      </section>

      <section>
        <div id="log" class="log" aria-live="polite"></div>
        <div class="peer-panel">
          <div class="panel-title">
            <span>Active peer details</span>
            <span id="peerUpdated">waiting</span>
          </div>
          <div id="peerList" class="peer-list">No connected peers.</div>
        </div>
      </section>
    </div>
  </main>

  <script src="coi-serviceworker.js"></script>
  <script src="sqlite-bridge.js"></script>
  <script src="wasm_exec.js"></script>
  <script>
    const logEl = document.getElementById('log');
    const statusEl = document.getElementById('status');
    const peerCountEl = document.getElementById('peerCount');
    const peerListEl = document.getElementById('peerList');
    const peerUpdatedEl = document.getElementById('peerUpdated');
    const buttons = [...document.querySelectorAll('button')];
    const peer = document.getElementById('peer');
    const peerSelect = document.getElementById('peerSelect');
    const proxy = document.getElementById('proxy');

    window.neutrinoLog = (line) => {
      const stamp = new Date().toLocaleTimeString();
      logEl.textContent += `[${stamp}] ${line}\n`;
      logEl.scrollTop = logEl.scrollHeight;
    };
    window.neutrinoStatus = (text) => {
      statusEl.textContent = text;
    };
    window.neutrinoPeerCount = (count) => {
      peerCountEl.textContent = `${count}`;
    };
    window.neutrinoPeerList = (text) => {
      peerListEl.textContent = text || 'No connected peers.';
      peerUpdatedEl.textContent = new Date().toLocaleTimeString();
    };

    function setReady(ready) {
      statusEl.textContent = ready ? 'ready' : 'loading';
      buttons.forEach((button) => button.disabled = !ready);
    }

    setReady(false);
    peerSelect.addEventListener('change', () => {
      peer.value = peerSelect.value;
    });
    document.getElementById('initBtn').onclick = () => window.neutrinoDemo.initStorage(proxy.value);
    document.getElementById('bestBtn').onclick = () => window.neutrinoDemo.bestBlock();
    document.getElementById('connectBtn').onclick = () => window.neutrinoDemo.connect(peer.value, proxy.value);
    document.getElementById('filterBtn').onclick = () => window.neutrinoDemo.fetchTip();
    document.getElementById('peersBtn').onclick = () => window.neutrinoDemo.listPeers();
    document.getElementById('stopBtn').onclick = () => window.neutrinoDemo.stop();
    document.getElementById('clearBtn').onclick = () => { logEl.textContent = ''; };

    const go = new Go();
    WebAssembly.instantiateStreaming(fetch('main.wasm'), go.importObject).then((result) => {
      go.run(result.instance);
      setReady(true);
    }).catch((err) => {
      statusEl.textContent = 'error';
      window.neutrinoLog(`wasm load failed: ${err}`);
    });
  </script>
</body>
</html>
